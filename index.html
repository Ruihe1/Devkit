<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevKit - free developer toolbox</title>
<meta name="description" content="Free, private developer toolbox: JSON, Base64, URL, SHA, UUID, Regex, timestamp, JWT, diff and password tools. Runs in your browser.">
<style>
:root{--bg:#060914;--ink:#e8ecf8;--mut:#9aa6c8;--card:rgba(10,15,36,.8);--line:rgba(160,180,255,.25);--acc:#f5b94a;--onacc:#10131f;--in:rgba(3,6,18,.7)}
:root[data-theme=light]{--bg:#eef1fa;--ink:#141a33;--mut:#4d5a82;--card:rgba(255,255,255,.85);--line:rgba(40,60,140,.28);--acc:#b4560a;--onacc:#fff;--in:rgba(255,255,255,.92)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif;min-height:100vh}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
:root[data-theme=light] #bg{filter:invert(1) hue-rotate(180deg)}
header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:760px;margin:0 auto}
h1{margin:0;font:700 1.5rem Georgia,serif;letter-spacing:.02em}
header div{display:flex;gap:8px}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 12px 40px;transition:opacity .3s}
body.scene .app{opacity:0;pointer-events:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
nav button{white-space:nowrap}
button{font:inherit;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#t{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(8px)}
textarea,input[type=text],input[type=number]{width:100%;background:var(--in);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:14px ui-monospace,Menlo,monospace;margin-bottom:8px}
textarea{min-height:110px}
pre{white-space:pre-wrap;word-break:break-all;background:var(--in);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:48px;margin:8px 0;font:14px ui-monospace,Menlo,monospace}
pre.err{color:#e5484d}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.add{color:#1a9d4a}.del{color:#e5484d}
label{display:flex;gap:6px;align-items:center}
footer{margin-top:14px;color:var(--mut);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<header>
<h1>DevKit</h1>
<div><button id="sb" onclick="sc()">Scene</button><button onclick="th()">Light/dark</button></div>
</header>
<main class="app">
<nav></nav>
<section id="t"></section>
<footer>Runs in your browser. Nothing is uploaded. MIT license.</footer>
</main>
<noscript>DevKit needs JavaScript to run.</noscript>
<script>
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder(),v=id=>$('#'+id).value;
function o(t,err,html){const e=$('#o');e.className=err?'err':'';html?e.innerHTML=t:e.textContent=t}
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const hexs=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b2s=a=>{let s='';a.forEach(b=>s+=String.fromCharCode(b));return s};
function ub64(s){s=s.trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return dec.decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function jf(n){try{o(JSON.stringify(JSON.parse(v('a')),null,n))}catch(e){o(e.message,1)}}
function b6(d){try{o(d?ub64(v('a')):btoa(b2s(enc.encode(v('a')))))}catch(e){o('That is not valid Base64.',1)}}
function ul(d){try{o(d?decodeURIComponent(v('a')):encodeURIComponent(v('a')))}catch(e){o('That is not a valid encoded URL.',1)}}
async function sh(){const b=enc.encode(v('a'));let r='';for(const k of['SHA-1','SHA-256','SHA-384','SHA-512'])r+=k+'\n'+hexs(await crypto.subtle.digest(k,b))+'\n\n';o(r.trim())}
function ug(){const n=Math.min(Math.max(+v('a')||5,1),100);o(Array.from({length:n},()=>crypto.randomUUID()).join('\n'))}
function rx(){if(!v('a'))return o('Type a pattern above.');try{let f=v('f');if(!f.includes('g'))f+='g';const m=[...v('x').matchAll(new RegExp(v('a'),f))];o(m.length?m.map((q,i)=>'#'+(i+1)+' at '+q.index+': '+q[0]+(q.length>1?'\n   groups: '+q.slice(1).join(' | '):'')).join('\n'):'No matches.')}catch(e){o(e.message,1)}}
function ts(now){let s=now?String(Date.now()):v('a').trim(),d;if(now)$('#a').value=s;if(/^-?\d+(\.\d+)?$/.test(s)){const n=+s;d=new Date(Math.abs(n)<1e11?n*1000:n)}else d=new Date(s);if(isNaN(d))return o('Could not read that. Try 1700000000 or 2024-05-01 12:00.',1);o('Unix seconds: '+Math.floor(d/1000)+'\nUnix ms: '+(+d)+'\nUTC: '+d.toISOString()+'\nLocal: '+d.toString())}
function jw(){try{const p=v('a').trim().split('.');if(p.length<2)throw 0;o('Header\n'+JSON.stringify(JSON.parse(ub64(p[0])),null,2)+'\n\nPayload\n'+JSON.stringify(JSON.parse(ub64(p[1])),null,2)+'\n\nThe signature is not checked.')}catch(e){o('That does not look like a JWT.',1)}}
function df(){const A=v('a').split('\n'),B=v('b').split('\n'),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);let i=0,j=0,r='';const d=x=>'<span class=del>- '+esc(x)+'</span>\n',a=x=>'<span class=add>+ '+esc(x)+'</span>\n';while(i<n&&j<m){if(A[i]===B[j]){r+='  '+esc(A[i])+'\n';i++;j++}else if(L[i+1][j]>=L[i][j+1])r+=d(A[i++]);else r+=a(B[j++])}while(i<n)r+=d(A[i++]);while(j<m)r+=a(B[j++]);o(r,0,1)}
function pw(){let s='';if($('#u').checked)s+='ABCDEFGHJKLMNPQRSTUVWXYZ';if($('#l').checked)s+='abcdefghijkmnpqrstuvwxyz';if($('#d').checked)s+='23456789';if($('#y').checked)s+='!@#$%^&*-_=+?';if(!s)return o('Tick at least one box.',1);const n=Math.min(Math.max(+v('a')||16,4),128),lim=Math.floor(2**32/s.length)*s.length;let r='';while(r.length<n){const x=crypto.getRandomValues(new Uint32Array(1))[0];if(x<lim)r+=s[x%s.length]}o(r)}
function cl(x){const s=x?v('p'):v('a').trim(),e=document.createElement('i');e.style.color=s;if(!e.style.color)return o('Could not read that color. Try #ff8800 or rgb(255,136,0).',1);document.body.appendChild(e);const m=getComputedStyle(e).color.match(/[\d.]+/g).map(Number);e.remove();const[rr,gg,bb]=m,hx='#'+[rr,gg,bb].map(n=>n.toString(16).padStart(2,'0')).join(''),r1=rr/255,g1=gg/255,b1=bb/255,mx=Math.max(r1,g1,b1),mn=Math.min(r1,g1,b1),d=mx-mn,l=(mx+mn)/2;let hh=0,ss=0;if(d){ss=d/(1-Math.abs(2*l-1));hh=mx==r1?((g1-b1)/d+6)%6:mx==g1?(b1-r1)/d+2:(r1-g1)/d+4;hh*=60}if(x)$('#a').value=hx;else $('#p').value=hx;o('<span style="display:inline-block;width:1.2em;height:1.2em;background:'+hx+';border:1px solid #888;vertical-align:middle"></span>\nHEX: '+hx+'\nRGB: rgb('+rr+', '+gg+', '+bb+')\nHSL: hsl('+Math.round(hh)+', '+Math.round(ss*100)+'%, '+Math.round(l*100)+'%)',0,1)}
function md(){const inl=s=>s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s"']+)\)/g,'<a href="$2" target=_blank rel=noopener>$1</a>');let h='',li=0,m;for(const l of esc(v('a')).split('\n')){if(m=l.match(/^(#{1,6})\s+(.*)/)){if(li){h+='</ul>';li=0}h+='<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>'}else if(m=l.match(/^\s*[-*]\s+(.*)/)){if(!li){h+='<ul>';li=1}h+='<li>'+inl(m[1])+'</li>'}else{if(li){h+='</ul>';li=0}if(l.trim())h+='<p>'+inl(l)+'</p>'}}if(li)h+='</ul>';o(h||'Write some Markdown above.',0,1);$('#o').style.cssText='font:inherit;white-space:normal;word-break:normal'}
function cr(){const p=v('a').trim().split(/\s+/);if(p.length!=5)return o('A cron needs 5 parts: minute hour day-of-month month day-of-week. Example: 30 9 * * 1-5',1);const nm=['minute','hour','day of month','month','day of week'],mo='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' '),dw='Sun Mon Tue Wed Thu Fri Sat'.split(' '),g=(s,i)=>s=='*'?'any':/^\*\/\d+$/.test(s)?'every '+s.slice(2):s.replace(/\d+/g,n=>i==3?mo[n-1]||n:i==4?dw[n%7]||n:n);const t=/^\d+$/.test(p[0])&&/^\d+$/.test(p[1])?'Runs at '+p[1].padStart(2,'0')+':'+p[0].padStart(2,'0')+', on the days below.':'Runs on the schedule below.';o(t+'\n\n'+p.map((s,i)=>nm[i]+': '+g(s,i)).join('\n'))}
function sq(){let s=v('a').replace(/\s+/g,' ').trim();s=s.replace(/\b(select|from|where|group by|order by|having|limit|left join|right join|inner join|join|union|insert into|values|update|set|delete from)\b/gi,m=>'\n'+m.toUpperCase()).replace(/\b(and|or)\b/gi,m=>'\n  '+m.toUpperCase()).replace(/\b(on|as|in|not|null|like|between|desc|asc|distinct|case|when|then|else|end)\b/gi,m=>m.toUpperCase());o(s.trim()||'Paste SQL above.')}
function cp(){navigator.clipboard.writeText($('#o').textContent).then(()=>{$('#cb').textContent='Copied';setTimeout(()=>$('#cb').textContent='Copy result',1200)}).catch(()=>{})}
const T=[
{n:'JSON',h:"<textarea id=a placeholder='Paste JSON here'></textarea><div class=row><button onclick=jf(2)>Format</button><button onclick=jf(0)>Minify</button></div>"},
{n:'Base64',h:"<textarea id=a placeholder='Text or Base64'></textarea><div class=row><button onclick=b6(0)>Encode</button><button onclick=b6(1)>Decode</button></div>"},
{n:'URL',h:"<textarea id=a placeholder='Text or encoded URL'></textarea><div class=row><button onclick=ul(0)>Encode</button><button onclick=ul(1)>Decode</button></div>"},
{n:'SHA',h:"<textarea id=a placeholder='Text to hash'></textarea><div class=row><button onclick=sh()>Make hashes</button></div>"},
{n:'UUID',h:"<input id=a type=number value=5 min=1 max=100><div class=row><button onclick=ug()>Generate</button></div>",go:ug},
{n:'Regex',h:"<input id=a type=text placeholder='Pattern, like [a-z]+' oninput=rx()><input id=f type=text value=g oninput=rx()><textarea id=x placeholder='Text to test' oninput=rx()></textarea>"},
{n:'Time',h:"<input id=a type=text placeholder='Unix time or a date'><div class=row><button onclick=ts()>Convert</button><button onclick=ts(1)>Now</button></div>"},
{n:'JWT',h:"<textarea id=a placeholder='Paste a JWT token'></textarea><div class=row><button onclick=jw()>Decode</button></div>"},
{n:'Diff',h:"<textarea id=a placeholder='Original text'></textarea><textarea id=b placeholder='New text'></textarea><div class=row><button onclick=df()>Compare</button></div>"},
{n:'Password',h:"<input id=a type=number value=16 min=4 max=128><div class=row><label><input id=u type=checkbox checked>A-Z</label><label><input id=l type=checkbox checked>a-z</label><label><input id=d type=checkbox checked>0-9</label><label><input id=y type=checkbox checked>Symbols</label></div><div class=row><button onclick=pw()>Generate</button></div>",go:pw},
{n:'Color',h:"<input id=a type=text value=#ff8800 placeholder='#ff8800 or rgb(255,136,0)' oninput=cl()><div class=row><input id=p type=color value=#ff8800 oninput=cl(1) style=width:64px;height:40px></div>",go:cl},
{n:'Markdown',h:"<textarea id=a placeholder='Write Markdown here' oninput=md()># Hello\n- **bold** and *italic*\n- `code` and [a link](https://example.com)</textarea>",go:md},
{n:'Cron',h:"<input id=a type=text value='30 9 * * 1-5' placeholder='30 9 * * 1-5'><div class=row><button onclick=cr()>Explain</button></div>",go:cr},
{n:'SQL',h:"<textarea id=a placeholder='Paste SQL here'></textarea><div class=row><button onclick=sq()>Format</button></div>"}
];
$('nav').innerHTML=T.map((t,i)=>'<button onclick=sel('+i+')>'+t.n+'</button>').join('');
function sel(i){document.querySelectorAll('nav button').forEach((b,k)=>b.classList.toggle('on',k==i));$('#t').innerHTML=T[i].h+'<pre id=o></pre><div class=row><button id=cb onclick=cp()>Copy result</button></div>';try{history.replaceState(0,'','#'+T[i].n.toLowerCase())}catch(e){}T[i].go&&T[i].go()}
sel(Math.max(0,T.findIndex(t=>t.n.toLowerCase()==location.hash.slice(1))));
function sc(){const s=document.body.classList.toggle('scene');$('#sb').textContent=s?'Show tools':'Scene'}
function th(){const r=document.documentElement,l=r.dataset.theme!='light';r.dataset.theme=l?'light':'dark';try{localStorage.setItem('devkit-theme',r.dataset.theme)}catch(e){}}
try{const s=localStorage.getItem('devkit-theme');if(s)document.documentElement.dataset.theme=s}catch(e){}

/* Background: spinning galaxy (inner part clockwise, outer part counter-clockwise),
   a black hole, orbiting planets that can crash and explode, drifting and shooting stars. */
const cv=$('#bg'),c=cv.getContext('2d'),K=matchMedia('(prefers-reduced-motion:reduce)').matches?.3:1,rnd=Math.random;
let W,H,cx,cy,R,gal=[],stars=[],sparks=[],shots=[];
function mk(){return{rx:R*(.5+rnd()*.65),ry:R*(.3+rnd()*.55),tilt:rnd()*3.14,a:rnd()*6.28,w:(.25+rnd()*.4)*(rnd()<.5?-1:1),r:6+rnd()*7,hue:rnd()*360,dead:0}}
let P=[];
function size(){const D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;c.setTransform(D,0,0,D,0,0);cx=W/2;cy=W<700?H*.68:H*.5;R=Math.min(W,H)*.42;
gal=[];for(let i=0;i<750;i++){const f=rnd()**.8,r=R*(.07+.93*f);gal.push({r,a:(i%3)*2.094+f*3.4+(rnd()-.5)*.55,s:rnd()*1.5+.5,col:'hsla('+(45+f*190)+',90%,'+(65+rnd()*20)+'%,'+(.45+rnd()*.5)+')'})}
stars=[];for(let i=0;i<Math.round(W*H/4500);i++)stars.push({x:rnd()*W,y:rnd()*H,z:.3+rnd(),p:rnd()*9,s:rnd()*1.3+.3});
P=[mk(),mk(),mk(),mk()]}
function boom(x,y,h){for(let i=0;i<70;i++){const an=rnd()*6.28,sp=30+rnd()*150;sparks.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:1,h:h+rnd()*50})}}
function pos(p){const x=Math.cos(p.a)*p.rx,y=Math.sin(p.a)*p.ry,ct=Math.cos(p.tilt),st=Math.sin(p.tilt);return[cx+x*ct-y*st,cy+x*st+y*ct]}
let last=0,shotT=2;
function frame(t){const dt=Math.min((t-last)/1000,.05)*K;last=t;
c.globalCompositeOperation='source-over';c.fillStyle='#060914';c.fillRect(0,0,W,H);
let g=c.createRadialGradient(cx,cy,0,cx,cy,R*1.4);g.addColorStop(0,'rgba(90,70,190,.4)');g.addColorStop(1,'rgba(6,9,20,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
c.globalCompositeOperation='lighter';
for(const s of stars){s.x-=s.z*dt*18;if(s.x<0)s.x+=W;c.fillStyle='rgba(220,230,255,'+(.35+.6*Math.abs(Math.sin(t/700*s.z+s.p)))+')';c.fillRect(s.x,s.y,s.s,s.s)}
shotT-=dt;if(shotT<0){shotT=3+rnd()*5;shots.push({x:rnd()*W,y:rnd()*H*.5,vx:-300-rnd()*200,vy:120+rnd()*100,l:1})}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*1.2;if(s.l<=0){shots.splice(i,1);continue}c.strokeStyle='rgba(255,255,255,'+s.l+')';c.lineWidth=1.5;c.beginPath();c.moveTo(s.x,s.y);c.lineTo(s.x-s.vx*.08,s.y-s.vy*.08);c.stroke()}
const Rm=R*.45;
for(const q of gal){q.a+=(q.r<Rm?.55*(1.25-q.r/Rm)+.12:-(.1+.22*(1-(q.r-Rm)/(R-Rm))))*dt;c.fillStyle=q.col;c.fillRect(cx+Math.cos(q.a)*q.r,cy+Math.sin(q.a)*q.r,q.s,q.s)}
g=c.createRadialGradient(cx,cy,R*.05,cx,cy,R*.2);g.addColorStop(0,'rgba(255,190,80,.9)');g.addColorStop(1,'rgba(255,120,40,0)');c.fillStyle=g;c.beginPath();c.arc(cx,cy,R*.2,0,6.283);c.fill();
c.globalCompositeOperation='source-over';c.fillStyle='#000';c.beginPath();c.arc(cx,cy,R*.06,0,6.283);c.fill();
for(const p of P){if(p.dead>0){p.dead-=dt;if(p.dead<=0)Object.assign(p,mk());continue}p.a+=p.w*dt;const[x,y]=pos(p);g=c.createRadialGradient(x-p.r*.3,y-p.r*.3,1,x,y,p.r);g.addColorStop(0,'hsl('+p.hue+',80%,75%)');g.addColorStop(1,'hsl('+p.hue+',60%,25%)');c.fillStyle=g;c.beginPath();c.arc(x,y,p.r,0,6.283);c.fill()}
for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const a=P[i],b=P[j];if(a.dead>0||b.dead>0)continue;const[x1,y1]=pos(a),[x2,y2]=pos(b);if(Math.hypot(x1-x2,y1-y2)<a.r+b.r){boom((x1+x2)/2,(y1+y2)/2,a.hue);a.dead=b.dead=3}}
c.globalCompositeOperation='lighter';
for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt*.8;if(s.l<=0){sparks.splice(i,1);continue}c.fillStyle='hsla('+s.h+',100%,65%,'+s.l+')';c.fillRect(s.x,s.y,2.5,2.5)}
requestAnimationFrame(frame)}
addEventListener('resize',size);size();requestAnimationFrame(frame);
</script>
</body>
</html>
