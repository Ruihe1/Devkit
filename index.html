<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevKit - private developer tools</title>
<style>
:root,[data-theme=light]{color-scheme:light;--bg:#f8fafc;--card:rgba(255,255,255,.9);--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#6366f1;--ok:#16a34a;--bad:#dc2626;--code:#f1f5f9;--glow:rgba(99,102,241,.16);--shadow:0 10px 32px rgba(15,23,42,.08)}
[data-theme=dark]{color-scheme:dark;--bg:#0b0f1a;--card:rgba(10,14,30,.72);--ink:#e5e9f5;--mut:#8a94b0;--line:#222c47;--acc:#818cf8;--ok:#4ade80;--bad:#f87171;--code:#0a0e18;--glow:rgba(129,140,248,.2);--shadow:0 10px 32px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#02030a;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,nav,main{max-width:880px;margin:0 auto;padding-left:16px;padding-right:16px}
header{padding-top:20px;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#06b6d4);display:grid;place-items:center;color:#fff;font:700 15px ui-monospace,Menlo,monospace;box-shadow:0 6px 18px rgba(99,102,241,.4)}
.hd{flex:1;min-width:0}
h1{margin:0;font-size:1.45rem;letter-spacing:-.02em;line-height:1.1}
.hd p{margin:2px 0 0;color:var(--mut);font-size:.82rem}
#tg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer;box-shadow:var(--shadow)}
.badge{display:inline-block;margin:16px 16px 0;padding:4px 12px;border-radius:999px;background:var(--glow);color:var(--acc);font-size:.78rem;font-weight:600}
.bw{max-width:880px;margin:0 auto}
nav{display:flex;gap:8px;overflow-x:auto;padding-top:14px;padding-bottom:14px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer;transition:transform .15s,border-color .15s}
nav button:hover{border-color:var(--acc);transform:translateY(-1px)}
nav button[aria-current=true]{background:linear-gradient(135deg,#6366f1,#06b6d4);border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(99,102,241,.35)}
main{padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--glow);display:grid;place-items:center;font-size:22px}
h2{margin:0;font-size:1.15rem;letter-spacing:-.01em}
.ch p{margin:2px 0 0;color:var(--mut);font-size:.85rem}
textarea,input[type=text],input[type=number],select{width:100%;background:var(--code);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;font:14px ui-monospace,Menlo,Consolas,monospace;outline:0;transition:border-color .15s,box-shadow .15s}
textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
textarea{min-height:140px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:12px 0}
.row label{display:flex;gap:6px;align-items:center;font-size:.9rem}
.row select{width:auto}
input[type=checkbox],input[type=radio]{accent-color:#6366f1;width:16px;height:16px}
button.b{background:linear-gradient(135deg,#6366f1,#06b6d4);color:#fff;border:0;border-radius:10px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.35)}
.out{background:var(--code);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:12px;margin:12px 0 0;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;cursor:copy;min-height:20px}
.out:hover{border-color:var(--acc)}
.out:empty{display:none}
.st{font-size:.9rem;margin-top:10px;font-weight:500}.ok{color:var(--ok)}.bad{color:var(--bad)}
.lab{font-size:.8rem;color:var(--mut);margin:14px 0 4px;font-weight:600}
.add{color:var(--ok)}.del{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.hd p{display:none}}
footer{text-align:center;color:var(--mut);font-size:.8rem;padding:0 16px 30px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

#space{position:fixed;inset:0;z-index:0;overflow:hidden;background:#02030a;perspective:900px}
#pl{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
#stars{position:absolute;inset:0;width:100%;height:100%}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 35%,rgba(2,3,10,.65) 100%)}
header,nav,main,footer,.bw{position:relative;z-index:1}
h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.hd p{color:rgba(255,255,255,.78)}
.badge{background:rgba(255,255,255,.12);color:#d6e4ff;backdrop-filter:blur(8px)}
.card,nav button,#tg{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
footer{color:rgba(255,255,255,.6)}
#pl{inset:-30px}#scene{position:absolute;inset:0;width:100%;height:100%}
#sv{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer;box-shadow:var(--shadow);backdrop-filter:blur(14px);margin-right:8px}
nav,main,.bw,footer{transition:opacity .4s}
body.view nav,body.view main,body.view .bw,body.view footer{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="space"><div id="pl"><canvas id="scene"></canvas></div><canvas id="stars"></canvas><div id="vig"></div></div>
<header><div class="logo">&lt;/&gt;</div><div class="hd"><h1>DevKit</h1><p>Free developer tools that run in your browser</p></div><button id="sv">🎬 Scene</button><button id="tg" aria-label="Switch theme"></button></header>
<div class="bw"><span class="badge">🔒 100% private: nothing is uploaded</span></div>
<nav id="nav" aria-label="Tools"></nav>
<main><div class="card"><div class="ch"><span class="ic" id="ic"></span><div><h2 id="title"></h2><p id="desc"></p></div></div><div id="tool"></div></div></main>
<footer>Tap any result to copy it.</footer>
<div id="toast">Copied</div>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
const toBytes=s=>new TextEncoder().encode(s);
const b64e=(s,url)=>{let t='';toBytes(s).forEach(b=>t+=String.fromCharCode(b));let r=btoa(t);return url?r.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''):r};
const b64d=s=>{s=s.trim().replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);const t=atob(s);return new TextDecoder().decode(Uint8Array.from(t,c=>c.charCodeAt(0)))};
const sortKeys=v=>Array.isArray(v)?v.map(sortKeys):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sortKeys(v[k])])):v;
function status(el,msg,ok){el.className='st '+(ok?'ok':'bad');el.textContent=msg}
function toast(){const t=document.getElementById('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),900)}
document.addEventListener('click',e=>{const o=e.target.closest('.out');if(o&&o.textContent){navigator.clipboard&&navigator.clipboard.writeText(o.textContent).then(toast)}});

function diffLines(a,b){const x=a.split('\n'),y=b.split('\n'),n=x.length,m=y.length;
const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
let i=0,j=0;const o=[];
while(i<n&&j<m){if(x[i]===y[j]){o.push(['=',x[i]]);i++;j++}else if(L[i+1][j]>=L[i][j+1])o.push(['-',x[i++]]);else o.push(['+',y[j++]])}
while(i<n)o.push(['-',x[i++]]);while(j<m)o.push(['+',y[j++]]);return o}

const TOOLS=[
{name:'JSON',title:'JSON formatter and validator',
html:`<textarea id="i" placeholder="Paste JSON here"></textarea>
<div class="row"><label>Indent <select id="n"><option>2<option>4<option>8</select></label><label><input type="checkbox" id="s"> Sort keys</label><label><input type="checkbox" id="m"> Minify</label></div>
<div id="st"></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{const t=q('#i').value;q('#o').textContent='';if(!t.trim()){q('#st').textContent='';return}
try{let v=JSON.parse(t);if(q('#s').checked)v=sortKeys(v);
q('#o').textContent=q('#m').checked?JSON.stringify(v):JSON.stringify(v,null,+q('#n').value);status(q('#st'),'Valid JSON',1)}
catch(e){status(q('#st'),'Invalid JSON: '+e.message,0)}};
['#i','#n','#s','#m'].forEach(s=>q(s).addEventListener('input',run))}},

{name:'Base64',title:'Base64 encode and decode',
html:`<textarea id="i" placeholder="Text or Base64"></textarea>
<div class="row"><label><input type="radio" name="m" value="e" checked> Encode</label><label><input type="radio" name="m" value="d"> Decode</label><label><input type="checkbox" id="u"> URL-safe</label></div>
<div id="st"></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{const t=q('#i').value;q('#o').textContent='';q('#st').textContent='';if(!t)return;
try{q('#o').textContent=q('[name=m]:checked').value==='e'?b64e(t,q('#u').checked):b64d(t)}catch(e){status(q('#st'),'Could not process input',0)}};
q('#i').addEventListener('input',run);q('#u').addEventListener('input',run);q('#tool,[name=m]');document.querySelectorAll('[name=m]').forEach(r=>r.addEventListener('input',run))}},

{name:'URL',title:'URL encode and decode',
html:`<textarea id="i" placeholder="Text or URL"></textarea>
<div class="row"><label><input type="radio" name="m" value="e" checked> Encode</label><label><input type="radio" name="m" value="d"> Decode</label></div>
<div id="st"></div><pre class="out" id="o"></pre><div class="lab" id="ql"></div><pre class="out" id="p"></pre>`,
init(q){const run=()=>{const t=q('#i').value;q('#o').textContent='';q('#p').textContent='';q('#ql').textContent='';q('#st').textContent='';if(!t)return;
try{if(q('[name=m]:checked').value==='e'){q('#o').textContent=encodeURIComponent(t)}else{q('#o').textContent=decodeURIComponent(t);
try{const u=new URL(t);const ps=[...u.searchParams];if(ps.length){q('#ql').textContent='Query parameters';q('#p').textContent=ps.map(([k,v])=>k+' = '+v).join('\n')}}catch(_){}}}
catch(e){status(q('#st'),'Invalid encoding',0)}};
q('#i').addEventListener('input',run);document.querySelectorAll('[name=m]').forEach(r=>r.addEventListener('input',run))}},

{name:'Hash',title:'Hash generator',
html:`<textarea id="i" placeholder="Text to hash"></textarea><div id="r"></div>`,
init(q){q('#i').addEventListener('input',async()=>{const t=q('#i').value;const r=q('#r');r.innerHTML='';if(!t)return;
for(const a of ['SHA-1','SHA-256','SHA-384','SHA-512']){const h=hex(await crypto.subtle.digest(a,toBytes(t)));
r.insertAdjacentHTML('beforeend',`<div class="lab">${a}</div><pre class="out">${h}</pre>`)}})}},

{name:'UUID',title:'UUID generator',
html:`<div class="row"><label>How many <input type="number" id="n" value="5" min="1" max="100" style="width:90px"></label><button class="b" id="g">Generate</button></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{const n=Math.min(100,Math.max(1,+q('#n').value||1));q('#o').textContent=Array.from({length:n},()=>crypto.randomUUID()).join('\n')};
q('#g').onclick=run;run()}},

{name:'Regex',title:'Regex tester',
html:`<input type="text" id="p" value="(\\w+)@(\\w+)\\.com" aria-label="Pattern">
<div class="row"><label><input type="checkbox" id="fi"> Ignore case</label><label><input type="checkbox" id="fm"> Multiline</label><label><input type="checkbox" id="fs"> Dot matches newline</label></div>
<textarea id="t">alice@example.com, bob@test.com</textarea><div id="st"></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{q('#o').textContent='';let re;
try{re=new RegExp(q('#p').value,'g'+(q('#fi').checked?'i':'')+(q('#fm').checked?'m':'')+(q('#fs').checked?'s':''))}catch(e){status(q('#st'),e.message,0);return}
if(!q('#p').value){q('#st').textContent='';return}
const ms=[...q('#t').value.matchAll(re)].filter(m=>m[0]!==''||true).slice(0,200);
status(q('#st'),ms.length+' match'+(ms.length===1?'':'es'),ms.length>0);
q('#o').textContent=ms.map((m,i)=>`#${i+1} at ${m.index}: ${m[0]}`+m.slice(1).map((g,j)=>`\n   group ${j+1}: ${g}`).join('')).join('\n')};
['#p','#t','#fi','#fm','#fs'].forEach(s=>q(s).addEventListener('input',run));run()}},

{name:'Time',title:'Timestamp converter',
html:`<div class="lab">Unix timestamp (seconds or milliseconds)</div><input type="text" id="u"><pre class="out" id="o"></pre>
<div class="lab">Date (ISO, like 2026-01-31T12:00:00Z)</div><input type="text" id="d"><pre class="out" id="p"></pre>`,
init(q){const now=Math.floor(Date.now()/1000);q('#u').value=now;q('#d').value=new Date().toISOString();
const a=()=>{let n=Number(q('#u').value.trim());q('#o').textContent='';if(!q('#u').value.trim()||isNaN(n))return;
if(Math.abs(n)>1e11)n/=1000;const d=new Date(n*1000);if(isNaN(d))return;q('#o').textContent='UTC:   '+d.toISOString()+'\nLocal: '+d.toString()};
const b=()=>{const d=new Date(q('#d').value.trim());q('#p').textContent=isNaN(d)?'':'seconds: '+Math.floor(d/1000)+'\nmillis:  '+d.getTime()};
q('#u').addEventListener('input',a);q('#d').addEventListener('input',b);a();b()}},

{name:'JWT',title:'JWT decoder',
html:`<textarea id="i" placeholder="Paste a JWT"></textarea><div id="st"></div><div class="lab">Header</div><pre class="out" id="h"></pre><div class="lab">Payload</div><pre class="out" id="p"></pre>`,
init(q){q('#i').addEventListener('input',()=>{const t=q('#i').value.trim();q('#h').textContent='';q('#p').textContent='';q('#st').textContent='';if(!t)return;
const parts=t.split('.');if(parts.length!==3){status(q('#st'),'A JWT has 3 parts separated by dots',0);return}
try{const h=JSON.parse(b64d(parts[0])),p=JSON.parse(b64d(parts[1]));q('#h').textContent=JSON.stringify(h,null,2);q('#p').textContent=JSON.stringify(p,null,2);
if(typeof p.exp==='number'){const gone=p.exp*1000<Date.now();status(q('#st'),(gone?'Expired ':'Valid until ')+new Date(p.exp*1000).toUTCString()+'. Signature is not verified.',!gone)}
else status(q('#st'),'Decoded only. Signature is not verified.',1)}catch(e){status(q('#st'),'Could not decode token',0)}})}},

{name:'Diff',title:'Text diff',
html:`<div class="grid"><textarea id="a" placeholder="Original"></textarea><textarea id="b" placeholder="Changed"></textarea></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{const a=q('#a').value,b=q('#b').value;if(!a&&!b){q('#o').innerHTML='';return}
const d=diffLines(a,b);q('#o').innerHTML=d.every(x=>x[0]==='=')?'No differences':d.map(([k,l])=>k==='+'?`<span class="add">+ ${esc(l)}</span>`:k==='-'?`<span class="del">- ${esc(l)}</span>`:`  ${esc(l)}`).join('\n')};
q('#a').addEventListener('input',run);q('#b').addEventListener('input',run)}},

{name:'Password',title:'Password generator',
html:`<div class="row"><label>Length <input type="number" id="n" value="20" min="8" max="128" style="width:90px"></label></div>
<div class="row"><label><input type="checkbox" id="l" checked> a-z</label><label><input type="checkbox" id="U" checked> A-Z</label><label><input type="checkbox" id="d" checked> 0-9</label><label><input type="checkbox" id="y" checked> Symbols</label></div>
<button class="b" id="g">Generate</button><div id="st"></div><pre class="out" id="o"></pre>`,
init(q){const run=()=>{let c='';if(q('#l').checked)c+='abcdefghijklmnopqrstuvwxyz';if(q('#U').checked)c+='ABCDEFGHIJKLMNOPQRSTUVWXYZ';if(q('#d').checked)c+='0123456789';if(q('#y').checked)c+='!@#$%^&*()-_=+[]{};:,.?';
if(!c){status(q('#st'),'Select at least one character set',0);q('#o').textContent='';return}q('#st').textContent='';
const len=Math.min(128,Math.max(8,+q('#n').value||20)),lim=Math.floor(2**32/c.length)*c.length;let out='';
while(out.length<len){const r=crypto.getRandomValues(new Uint32Array(1))[0];if(r<lim)out+=c[r%c.length]}q('#o').textContent=out};
q('#g').onclick=run;run()}}
];

const nav=document.getElementById('nav'),box=document.getElementById('tool'),title=document.getElementById('title');
const META={JSON:['🧾','Format, validate and minify JSON'],Base64:['🔤','Convert text to and from Base64'],URL:['🔗','Encode and decode links and parameters'],Hash:['#️⃣','Create SHA checksums of any text'],UUID:['🆔','Generate unique IDs instantly'],Regex:['🔍','Test patterns with live matches'],Time:['⏱','Convert unix time and dates'],JWT:['🔑','See inside a login token'],Diff:['↔️','Compare two texts line by line'],Password:['🔒','Make strong random passwords']};
function open(i){[...nav.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
const t=TOOLS[i];title.textContent=t.title;document.getElementById('ic').textContent=META[t.name][0];document.getElementById('desc').textContent=META[t.name][1];box.innerHTML=t.html;t.init(s=>box.querySelector(s));location.hash=t.name.toLowerCase()}
TOOLS.forEach((t,i)=>{const b=document.createElement('button');b.textContent=META[t.name][0]+' '+t.name;b.onclick=()=>open(i);nav.appendChild(b)});
open(Math.max(0,TOOLS.findIndex(t=>'#'+t.name.toLowerCase()===location.hash)));
(function(){
const cv=document.getElementById('stars'),cx=cv.getContext('2d'),pl=document.getElementById('pl');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W=0,H=0;const dpr=Math.min(2,devicePixelRatio||1);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
const mk=z=>({x:Math.random()*2-1,y:Math.random()*2-1,z:z||Math.random()*.95+.05,h:Math.random()});
const S=Array.from({length:reduce?40:130},()=>mk());
let tx=0,ty=0,mx=0,my=0,last=-1e9;
const point=(x,y)=>{tx=x/innerWidth*2-1;ty=y/innerHeight*2-1;last=performance.now()};
addEventListener('pointermove',e=>point(e.clientX,e.clientY));
addEventListener('pointerdown',e=>point(e.clientX,e.clientY));
const sp=reduce?.0003:.0016;
function frame(t){
if(t-last>3000){tx=Math.sin(t/5000)*.5;ty=Math.cos(t/6500)*.35}
mx+=(tx-mx)*.05;my+=(ty-my)*.05;
pl.style.transform='rotateX('+(-my*5)+'deg) rotateY('+(mx*5)+'deg) translate('+(-mx*22)+'px,'+(-my*22)+'px)';
cx.clearRect(0,0,W,H);const f=Math.max(W,H)*.55;
for(const s of S){
const z0=s.z+sp*5;s.z-=sp;
if(s.z<=.03){Object.assign(s,mk(1));continue}
const k=1/s.z,k0=1/z0;
const x1=W/2+s.x*f*k-mx*40*(1-s.z),y1=H/2+s.y*f*k-my*40*(1-s.z);
const x0=W/2+s.x*f*k0-mx*40*(1-z0),y0=H/2+s.y*f*k0-my*40*(1-z0);
if(x1<-20||x1>W+20||y1<-20||y1>H+20){Object.assign(s,mk(1));continue}
const a=Math.min(1,(1-s.z)*1.6);
cx.strokeStyle=s.h>.7?'rgba(160,200,255,'+a+')':'rgba(235,242,255,'+a+')';
cx.lineWidth=.4+(1-s.z)*1.8;cx.lineCap='round';
cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke()}
requestAnimationFrame(frame)}
requestAnimationFrame(frame)})();
